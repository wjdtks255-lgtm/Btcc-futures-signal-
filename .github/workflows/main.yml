name: BTCC Futures Quant Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: btcc-futures-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify files
        run: |
          echo "===== FILE CHECK ====="
          test -f main.py
          test -f requirements.txt
          echo "===== MAIN IMPORT CHECK ====="
          python -m py_compile main.py
          if grep -q "pandas" main.py; then
            echo "ERROR: pandas import still exists in main.py"
            exit 1
          fi
          echo "main.py OK - pandas 없음"

      - name: Check Telegram Secrets
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          echo "Telegram Secrets OK"

      - name: Run BTCC Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Save State
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update BTCC scanner state"
          file_pattern: bot_state.json
