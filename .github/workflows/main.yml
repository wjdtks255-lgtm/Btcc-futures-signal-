name: BTCC Futures Quant Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: btcc-futures-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate files
        run: |
          test -f main.py
          test -f requirements.txt
          python -m py_compile main.py
          if grep -q "pandas" main.py; then
            echo "ERROR: pandas detected in main.py"
            exit 1
          fi
          echo "Python validation OK"

      - name: Check Telegram Secrets
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_TOKEN" || (echo "TELEGRAM_TOKEN missing" && exit 1)
          test -n "$TELEGRAM_CHAT_ID" || (echo "TELEGRAM_CHAT_ID missing" && exit 1)
          echo "Telegram secrets OK"

      - name: Run BTCC Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Save State
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update BTCC bot state"
          file_pattern: bot_state.json
