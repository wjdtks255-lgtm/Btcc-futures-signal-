name: BTCC Signal Bot

concurrency:
  group: btcc-signal-bot
  cancel-in-progress: true

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-btcc-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Find and Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f Btcc-futures-signal-/requirements.txt ]; then
            pip install -r Btcc-futures-signal-/requirements.txt
          else
            find . -name "requirements.txt" -exec pip install -r {} \;
          fi

      - name: Find and Run BTCC Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f main.py ]; then
            python main.py
          elif [ -f Btcc-futures-signal-/main.py ]; then
            cd Btcc-futures-signal- && python main.py
          else
            PYTHON_FILE=$(find . -name "main.py" | head -n 1)
            if [ -n "$PYTHON_FILE" ]; then
              DIR_NAME=$(dirname "$PYTHON_FILE")
              cd "$DIR_NAME" && python main.py
            else
              echo "Error: main.py not found!"
              exit 1
            fi
          fi

      - name: Pull latest changes before commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || echo "No rebase needed"

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: |
            btcc_state.json
            **/btcc_state.json
          commit_message: "Update BTCC Bot state [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
